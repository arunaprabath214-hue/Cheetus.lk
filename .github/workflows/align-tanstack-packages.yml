name: Align TanStack packages and refresh lockfile

on:
  push:
    branches:
      - fix/tanstack-start-security

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Align compatible TanStack package versions
        run: |
          bun add --exact @tanstack/react-start@1.168.60 @tanstack/react-router@1.170.41 @tanstack/router-plugin@1.168.42

      - name: Verify lockfile consistency
        run: bun install --frozen-lockfile

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "Dependency files already match."
            exit 0
          fi
          git commit -m "Align TanStack packages after security update"
          git push
